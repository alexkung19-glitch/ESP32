<div class="vu-container">
  <div id="bar" class="vu-bar"></div>
</div>
<p>數值: <span id="val">0</span></p>

<style>
  .vu-container {
    width: 300px;
    height: 30px;
    background: #333;
    border-radius: 5px;
    overflow: hidden;
  }
  .vu-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(to right, green, yellow, red);
    transition: width 0.1s ease; /* 讓動畫變順滑 */
  }
</style>

<script>
  setInterval(function() {
    fetch('/data').then(response => response.text()).then(data => {
      let value = parseInt(data);
      document.getElementById('val').innerText = value;
      // 將 0-4095 轉換為 0-100%
      let percentage = (value / 4095) * 100;
      document.getElementById('bar').style.width = percentage + '%';
    });
  }, 100); // 每 0.1 秒更新一次
</script>
